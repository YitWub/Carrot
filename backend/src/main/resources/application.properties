server.port=${SERVER_PORT:9000}
cors.allowed-origins=${FRONTEND_URL:http://localhost:5999,http://localhost:5173,http://localhost:5174,http://localhost:5175,https://ywmarket.duckdns.org}

# Email setup
spring.mail.host=${SPRING_MAIL_HOST:smtp.naver.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true